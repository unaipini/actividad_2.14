name: CI/CD Sencillo

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar tests con pytest
        run: |
          pip install pytest
          pytest -v tests

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' # Solo deploy desde main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Despliegue simulado
        run: |
          echo "Despliegue sencillo: copiando archivos a carpeta local /tmp/deploy"
          mkdir -p /tmp/deploy
          cp -r src/* /tmp/deploy/
